# Every push and pull request: run the tests, then build both programs, unsigned.
# The programs are kept as a workflow artifact for a week, for trying out.
#
# Releases are not built here. They are built and code-signed on the maintainer's PC
# with scripts\build-release.ps1, because the code-signing certificate and the update
# key both stay there.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # The tool runs on Windows PowerShell 5.1, so it is tested and built with it.
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File test\Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Tests failed ($LASTEXITCODE)." }

      - name: Build (unsigned)
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build failed ($LASTEXITCODE)." }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-debloater-unsigned
          path: |
            bin/WindowsDebloater.exe
            bin/WindowsDebloaterSetup.exe
          retention-days: 7
          if-no-files-found: error
